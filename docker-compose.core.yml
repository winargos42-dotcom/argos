# ARGOS Core — Phase 1 Minimal
# Только ноутбук (Нексус): MCP 8000 + Redis + Prometheus + Grafana

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.brain
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_PORT=8000
      - REDIS_URL=redis://redis-cache:6379
      - TZ=Asia/Vladivostok
    env_file:
      - .env.docker
    command: uvicorn src.mcp_api_standalone:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ./logs:/var/log/argos
      - ./:/opt/argos:ro
    depends_on:
      redis-cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - argos-core

  redis-cache:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - argos-core

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - argos-core

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-argos_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - argos-core

networks:
  argos-core:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
