global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'argos-mcp'
    static_configs:
      - targets: ['mcp:8000']

  - job_name: 'argos-redis'
    static_configs:
      - targets: ['redis-cache:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
