# === ВАРИАНТ B: ST7789V (новые платы CYD) ===
display:
  - platform: st7789v
    model: "240X320"
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    rotation: 0
    update_interval: 3s
    id: tft_display
    lambda: |-
      it.filled_rectangle(0, 0, 240, 320, Color::BLACK);
      it.filled_rectangle(50, 100, 140, 120, Color::RED);
      it.print(70, 150, id(font_builtin), Color::WHITE, "ARGOS");

# Встроенный шрифт (не требует интернета)
font:
  - file: "gfonts://Roboto"
    id: font_builtin
    size: 24
