# ARGOS ESP32 CYD (2432S024) — упрощённый тестовый конфиг
esphome:
  name: argos-esp-tft
  friendly_name: ARGOS ESP TFT

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "SiG"
  password: "888888889"
  ap:
    ssid: "ARGOS-TFT-AP"
    password: "888888889"

captive_portal:
logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: "H7KMDsc92P9B6jfVzUtQJtiiUrhTO6Z5gS1L14+PvVN="

ota:
  - platform: esphome
    password: "888888889"

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO27
    id: tft_backlight

light:
  - platform: monochromatic
    output: tft_backlight
    name: "TFT Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

