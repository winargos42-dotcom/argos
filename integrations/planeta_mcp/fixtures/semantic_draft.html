<!doctype html><html lang="ru"><body>
<form id="campaign-draft">
  <label for="project-name">Название проекта</label>
  <input id="project-name" />

  <label for="funding-goal">Сумма сбора</label>
  <input id="funding-goal" inputmode="numeric" />

  <label for="short-description">Краткое описание проекта</label>
  <textarea id="short-description"></textarea>

  <label for="full-description">Описание проекта</label>
  <div id="full-description" contenteditable="true" role="textbox" aria-label="Описание проекта"></div>

  <button type="button" onclick="window.saved=(window.saved||0)+1">Сохранить</button>
  <button type="button" onclick="window.submitClicks=(window.submitClicks||0)+1">Отправить на модерацию</button>
</form>
<script>window.submitClicks=0; window.saved=0;</script>
</body></html>
