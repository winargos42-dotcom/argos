<!doctype html><html lang="ru"><body>
<form id="campaign-draft">
  <input name="title" data-testid="campaign-title" />
  <input name="target" data-testid="campaign-target" />
  <textarea name="summary" data-testid="campaign-summary"></textarea>
  <textarea name="story" data-testid="campaign-story"></textarea>
  <button type="button" data-testid="save-draft" onclick="window.saved=(window.saved||0)+1">Сохранить черновик</button>
  <button type="button" data-testid="submit-moderation" onclick="window.submitClicks=(window.submitClicks||0)+1">Отправить на модерацию</button>
</form>
<script>window.submitClicks=0; window.saved=0;</script>
</body></html>
