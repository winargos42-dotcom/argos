name: MUKHTAR real-data validation search
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - research/mukhtar-zerogpu-validation-v2-20261010
permissions:
  contents: read
jobs:
  real-biolocator-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU and dataset dependencies
        run: |
          python -m pip install -q --disable-pip-version-check numpy safetensors huggingface_hub
          python -m pip install -q --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Train on actual pinned MUKHTAR teacher dataset
        run: |
          python experimental/mukhtar-zerogpu-validation-v2/run_real_data.py
      - name: Preserve real-model metrics and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mukhtar-real-biolocator-20261010
          path: experimental/mukhtar-zerogpu-validation-v2/output/
          if-no-files-found: warn
          retention-days: 30
