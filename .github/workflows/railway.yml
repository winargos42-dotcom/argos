name: Deploy to Railway
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service argos-v2 --detach
        env:
          RAILWAY_TOKEN: b12bbfd4-ee56-4fe4-bdd3-0d1f38ef3e3c
