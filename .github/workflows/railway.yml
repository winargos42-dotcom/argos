name: Railway source-link check (not a deployment)
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-link-info:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment boundary
        run: |
          echo "GitHub repository commit: ${GITHUB_SHA}"
          echo "This workflow does not deploy to Railway."
          echo "Check Railway deployment logs and environment separately."
          echo "### Railway source-link check" >> "${GITHUB_STEP_SUMMARY}"
          echo "This workflow only acknowledges a GitHub push. It does **not** verify deployment." >> "${GITHUB_STEP_SUMMARY}"
