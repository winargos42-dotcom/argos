# ARGOS Phase 1.5 — +10 сервисов к Prometheus/Grafana/Redis из core
# Запуск: docker compose --env-file .env.docker -f docker-compose.phase1.yml up -d

services:
  # ─────────────── API GATEWAY ───────────────
  traefik:
    image: traefik:v3.0
    ports:
      - "127.0.0.1:81:80"
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --ping=true
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── VECTOR DB (память сущностей) ───────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── S3 ХРАНИЛИЩЕ ───────────────
  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=argos_admin
      - MINIO_ROOT_PASSWORD=argos_admin_change_me
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── TIME-SERIES DB ───────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=argos
      - POSTGRES_PASSWORD=argos_tsdb_pass
      - POSTGRES_DB=metrics
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── ЛОГИ (Grafana Stack) ───────────────
  loki:
    image: grafana/loki:2.9
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - argos-core

  promtail:
    image: grafana/promtail:2.9
    volumes:
      - ./logs:/var/log/argos:ro
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── ALERTS ───────────────
  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command: --config.file=/etc/alertmanager/config.yml
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── SECRETS ───────────────
  vault:
    image: hashicorp/vault:latest
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=argos-dev-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id="argos-dev-root-token"
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── HARDWARE METRICS ───────────────
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    restart: unless-stopped
    networks:
      - argos-core

  # ─────────────── DOCKER METRICS ───────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
    networks:
      - argos-core

networks:
  argos-core:
    external: true
    name: argoss_argos-core

volumes:
  qdrant_data:
  minio_data:
  timescale_data:
  loki_data:
  alertmanager_data:
  vault_data:
